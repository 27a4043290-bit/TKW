<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<body>
     <style>
        /* Cai dat chung */
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Times New Roman", serif;
            background-color: #fff8E7;
            color: #001F3F;
        }

        /* Thanh thong bao tren cung */
        .thongbao {
            background-color: #001F3F;
            color: #fff8E7;
            text-align: center;
            padding: 10px;
            font-size: 30px;
            letter-spacing: 2px;
        }

        /* Phan dau trang */
        .dautrang {
            padding: 20px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
            background-color: #fff8E7;
        }

        /* Ten thuong hieu */
        .logo h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: 3px;
        }

        .logo p {
            margin: 5px 0 0;
            font-size: 12px;
            color: #9c6c52;
            letter-spacing: 2px;
        }

        /* Menu dieu huong */
        .menu {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        .menu a {
            text-decoration: none;
            color: #001F3F;
            font-size: 17px;
        }

        .menu a:hover {
            color: #B68B55;
        }

        /* Cac chuc nang: tim kiem, tai khoan, gio hang */
        .tienich {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .tienich button {
            background: none;
            border: none;
            color: #001F3F;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
        }

        .tienich svg {
            width: 22px;
            height: 22px;
        }

        .tienich button:hover {
            color: #001F3F;
        }

        /* Hieu ung hien thi cac hop chuc nang */
        .khung-chuc-nang {
            display: none;
            max-width: 500px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border: 1px solid #fff8E7;
            color: #001F3F;
        }

        .khung-chuc-nang h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .khung-chuc-nang input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #001F3F;
            background-color: #fff8E7;
            font-family: "Times New Roman", serif;
            font-size: 16px;
        }

        .nut-chuc-nang {
            display: inline-block;
            background-color: #001F3F;
            color: white;
            padding: 12px 20px;
            border: none;
            cursor: pointer;
            font-family: "Times New Roman", serif;
            font-size: 16px;
        }

        .nut-chuc-nang:hover {
            background-color: #fff8E7;
            color:#001F3F;
        }

        .nut-dong {
            display: block;
            margin: 15px auto 0;
            color: #001F3F;
            background: none;
            border: none;
            cursor: pointer;
            font-family: "Times New Roman", serif;
            font-size: 15px;
        }
        .close-btn:hover {
         color: #001F3F;
      }

       
        .anhbia {
            height: 430px;
            background-image: url("https://cdn.phototourl.com/member/2026-10-09-3abcb040-0f09-4b33-ad46-e898fb5f4f66.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .anhbia1{
            
            height: 330px;
            background-image: url("https://cdn.phototourl.com/member/2026-10-10-7fe2ff2e-dc86-4eb5-8f21-09b5ab7ca65e.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        .anhbia2{
            
            height: 330px;
            background-image: url("https://cdn.phototourl.com/member/2026-10-10-ce154b6e-0e4c-44c0-aa81-05cbcd14d432.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Noi dung tren anh bia */
        .noidung {
            background-color: rgba(255, 249, 240, 0.9);
            padding: 30px;
            max-width: 650px;
        }

        .noidung p {
            color: #9C7952;
            letter-spacing: 3px;
        }

        .noidung h2 {
            font-size: 38px;
            margin: 15px 0;
        }

        .noidung .mota {
            color: #51483F;
            letter-spacing: 0;
            line-height: 1.6;
        }

        /* Nut bam */
        .nut {
            display: inline-block;
            background-color: #172A46;
            color: white;
            padding: 13px 25px;
            text-decoration: none;
            margin-top: 10px;
        }

        .nut:hover {
            background-color: #9C7952;
        }

        /* Tren dien thoai */
        @media (max-width: 900px) {
            .dautrang {
                flex-wrap: wrap;
                justify-content: center;
            }

            .logo {
                text-align: center;
                width: 100%;
            }

            .menu {
                justify-content: center;
                line-height: 2;
            }

            .menu a {
                font-size: 15px;
            }

            .tienich {
                justify-content: center;
            }
        }

        @media (max-width: 768px) {
            .anhbia {
                height: 350px;
            }

            .noidung {
                padding: 20px;
            }

            .noidung h2 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <!-- Thanh thong bao -->
    <div class="thongbao">
        THE MUSE
    </div>

    <!-- Dau trang -->
    <div class="dautrang">

        <div class="logo">
        </div>

        <!-- Menu -->
        <div class="menu">
            <a href="gioithieu.html">Giới thiệu</a>
            <a href="sanpham.html">Sản phẩm</a>
            <a href="The muse/chinhsach.html">Chính sách</a>           
            <a href="The muse/tk-theo-yc.html">Thiết kế theo yêu cầu</a>
            <a href="The muse/tintuc.html">Tin tức</a>
            <a href="The muse/lienhe.html">Liên hệ</a>
        </div>

        <!-- Ba bieu tuong moi -->
        <div class="tienich">

            <!-- Tim kiem -->
            <button onclick="moChucNang('timkiem')" title="Tìm kiếm" 
            onmouseover="this.style.color='#C9A45C'"
            onmouseout="this.style.color='#001F3F'">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="1.8">
                    <circle cx="10.5" cy="10.5" r="6.5"/>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"/>
                </svg>
            </button>

            <!-- Tai khoan -->
            <a href="dangnhap.html" title="Đăng nhập / Đăng ký"
            style="color: #001F3F;"
            onmouseover="this.style.color='#C9A45C'"
            onmouseout="this.style.color='#001F3F'">
                <svg viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8">
                   <circle cx="12" cy="8" r="4"/>
                   <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>
               </svg>
            </a>

<!-- Gio hang -->
            <a href="giohang.html" title="Giỏ hàng"
            style="color: #001F3F;"
            onmouseover="this.style.color='#C9A45C'"
            onmouseout="this.style.color='#001F3F'">
                 <svg viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="1.8">
                   <circle cx="9" cy="21" r="1"/>
                   <circle cx="19" cy="21" r="1"/>
                   <path d="M2 2h3l3 14h11l3-10H6"/>
                </svg>
            </a>

        </div>
    </div>

    <!-- Hop tim kiem -->
    <div class="khung-chuc-nang" id="timkiem">
        <h2>TÌM KIẾM BÁNH</h2>

        <input type="text" id="tukhoa"
               placeholder="Nhập tên bánh bạn muốn tìm...">

        <button class="nut-chuc-nang" onclick="timKiem()">
            Tìm kiếm
        </button>

        <p id="ketqua"></p>
        <button class="close-btn" onclick="dongChucNang()">&times;
            
        </button>
        
    </div>

    <!-- Anh bia va loi gioi thieu -->
    <div class="anhbia" id="gioithieu">

        <div class="noidung">

            <p>HANDMADE WITH LOVE</p>

            <h2>Ngọt ngào trong từng khoảnh khắc</h2>

            <p class="mota">
                Khám phá thế giới bánh ngọt tinh tế,
                nơi mỗi chiếc bánh là một câu chuyện
                và mỗi hương vị là một niềm vui.
            </p>

            <a href="#sanpham" class="nut">
                KHÁM PHÁ BÁNH NGỌT
            </a>

        </div>
    </div>

    <br> 
     </div>
        <div class="anhbia1">  
       </div>
    </div>
 
    <br>

     </div>
        <div class="anhbia2">  
       </div>
    </div>

    
    <script>
        // Mo hop chuc nang duoc chon
        function moChucNang(id) {
            dongChucNang();

            document.getElementById(id).style.display = "block";

            document.getElementById(id).scrollIntoView({
                behavior: "smooth",
                block: "center"
            });
        }

        // Dong tat ca cac hop
        function dongChucNang() {
            document.getElementById("timkiem").style.display = "none";
        }

        // Xu ly tim kiem
        function timKiem() {
            let tuKhoa = document.getElementById("tukhoa").value.trim();

            if (tuKhoa === "") {
                document.getElementById("ketqua").textContent =
                    "Vui lòng nhập tên bánh cần tìm.";
            } else {
                document.getElementById("ketqua").textContent =
                    'Bạn đang tìm: "' + tuKhoa +
                    '". Khi có danh sách sản phẩm, kết quả bánh sẽ hiển thị tại đây.';
            }
        }
    
    </script>

</body>
</html>
