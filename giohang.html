<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
     <style>
        body {
            font-family: "Times New Roman", serif;
            background: #FFF8E7;
            color: #001F3F;
            margin: 0;
            text-align: center;
            
        }

        header {
            background: #001F3F;
            color: #FFF8E7;
            padding: 20px;
            text-align: center;
        }
        .nd-giohang {
            color: #001F3F;
            font-size: 18px;
            margin-top: 0; 
            text-align: center;
            font-size:25px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
             padding: 20px;
        }

        nav {
            background: #E8D8B9;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: #001F3F;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }
        nav a:hover{
            color: #8A5A2B;

        }

        h2 {
            text-align: center;
            margin: 50px 0;
        }

        .khung {
            background: #fff8E7;
            max-width: 900px;
            margin: auto;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
            font-size:25px;
            display:flex;
            text-align: center;
            height:200px;
            
        }
        

        .sanpham {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding: 18px 0;
            border-bottom: 1px solid #ddd;
        }

        .thongtin {
            flex: 1;
        }

        .gia {
            color: #8A5A2B;
            font-weight: bold;
        }

        button {
            background: #001F3F;
            color: #fff8E7;
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 3px;
            font-size:20px;
        }

        button:hover {
            background:#8A5A2B;
            color: #fff8E7;

        }
         .anhnen {
            height: 430px;
            background-image: url("https://the350f.com/wp-content/uploads/2026/07/Tra-nhan-2026-2.jpg");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .xoa {
            background: #9B3333;
        }

        .tong {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            margin-top: 25px;
        }

        .nut {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 25px;
        }

        .rong {
            text-align: center;
            padding: 35px 10px;
        }

        @media (max-width: 600px) {
            .sanpham {
                flex-wrap: wrap;
            }

            .khung {
                margin: 10px;
                padding: 15px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>THE MUSE</h1>
    </header>
    <div class="nd-giohang"> 
        Giỏ hàng của bạn 
    </div>

    <nav>
         <a href="gioithieu.html">Giới thiệu</a>
            <a href="sanpham.html">Sản phẩm</a>
            <a href="The muse/chinhsach.html">Chính sách</a>
            <a href="The muse/tk-theo-yc.html">Thiết kế theo yêu cầu</a>
            <a href="The muse/tintuc.html">Tin tức</a>
            <a href="The muse/lienhe.html">Liên hệ</a>
    </nav>
<div class="anhnen"> 

    

    <div class="khung">
        <div id="danhsach"></div>
        <div id="tongtien"></div>
        <div id="nut"></div>
    </div>
</div>
    <script>
        function layGioHang() {
            return JSON.parse(localStorage.getItem("gioHang")) || [];
        }

        function hienThiGioHang() {
            let gioHang = layGioHang();
            let danhsach = document.getElementById("danhsach");
            let tongtien = document.getElementById("tongtien");
            let nut = document.getElementById("nut");

            danhsach.innerHTML = "";
            tongtien.innerHTML = "";
            nut.innerHTML = "";

            if (gioHang.length === 0) {
                danhsach.innerHTML = `
                    <div class="rong">
                        <h3>Giỏ hàng đang trống!</h3>
                        <p>Hãy chọn những chiếc bánh bạn yêu thích nhé.</p>
                        <button onclick="location.href='sanpham.html'">
                            Quay lại mua hàng
                        </button>
                    </div>
                `;
                return;
            }

            let tong = 0;

            gioHang.forEach(function(sp, index) {
                let thanhTien = sp.gia * sp.soLuong;
                tong += thanhTien;

                danhsach.innerHTML += `
                    <div class="sanpham">
                        <div class="thongtin">
                            <h3>${sp.ten}</h3>
                            <p>Kích thước: ${sp.kichThuoc || sp.size}</p>
                            <p>Đơn giá:
                                <span class="gia">
                                    ${sp.gia.toLocaleString("vi-VN")}đ
                                </span>
                            </p>
                            <p>Thành tiền:
                                <span class="gia">
                                    ${thanhTien.toLocaleString("vi-VN")}đ
                                </span>
                            </p>
                        </div>

                        <div>
                            <button onclick="thayDoiSoLuong(${index}, -1)">−</button>
                            <strong>${sp.soLuong}</strong>
                            <button onclick="thayDoiSoLuong(${index}, 1)">+</button>
                            <br>
                            <button class="xoa" onclick="xoaSanPham(${index})">
                                Xóa
                            </button>
                        </div>
                    </div>
                `;
            });

            tongtien.innerHTML = `
                <div class="tong">
                    Tổng tiền: ${tong.toLocaleString("vi-VN")}đ
                </div>
            `;

            nut.innerHTML = `
                <div class="nut">
                    <button onclick="location.href='sanpham.html'">
                        ← Tiếp tục mua hàng
                    </button>
                    <button class="xoa" onclick="xoaTatCa()">
                        Xóa tất cả
                    </button>
                </div>
            `;
        }

        function thayDoiSoLuong(index, thayDoi) {
            let gioHang = layGioHang();

            gioHang[index].soLuong += thayDoi;

            if (gioHang[index].soLuong <= 0) {
                gioHang.splice(index, 1);
            }

            localStorage.setItem("gioHang", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaSanPham(index) {
            let gioHang = layGioHang();

            gioHang.splice(index, 1);

            localStorage.setItem("gioHang", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaTatCa() {
            if (confirm("Bạn có chắc muốn xóa tất cả sản phẩm?")) {
                localStorage.removeItem("gioHang");
                hienThiGioHang();
            }
        }

        hienThiGioHang();
    </script>
</body>
</html>
