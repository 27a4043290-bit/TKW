<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
     <style>
        body {
            font-family: "Times New Roman", serif;
            background: #001F3F;
            color: #fff8E7;
            margin: 0;
            text-align: center;
            
        }

        .thongbao1 {
            background: #001F3F;
            color: #fff8E7;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
            text-align: center;
            font-size: 30px;
        }
        .nd-giohang {
            color: #fff8E7;
            font-size: 18px;
            margin-top: 0; 
            text-align: center;
            font-size:25px;
            font-family: 'Times New Roman', Times, serif;
            font-weight: bold;
             padding: 20px;
        }

        nav {
            background: #fff8E7;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: #fff8E7;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }
        nav a:hover{
            color: #8A5A2B;

        }

        h2 {
            text-align: center;
            margin: 50px 0;
        }

        .khung {
    background: #fff8E7;
    color: #001F3F;
    width: 90%;
    max-width: 1000px;
    margin: auto;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 3px 10px #ddd;
    font-size: 18px;

    display: flex;
    flex-direction: column;
    align-items: stretch;
    box-sizing: border-box;
    height: auto;
    min-height: 200px;
}

#danhsach, #tongtien, #nut {
    width: 100%;
    box-sizing: border-box;
    

}

.anhnen {
    min-height: 430px;
    height: auto;
    background-image: url("https://the350f.com/wp-content/uploads/2026/07/Tra-nhan-2026-2.jpg");
    background-size: cover;
    background-position: center;
    padding: 40px 0;
    box-sizing: border-box;
}

.sanpham {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 20px 0;
    border-bottom: 1px solid #ccc;
    text-align: left;
}

.anh-sanpham {
    width: 120px;
    height: 120px;
    object-fit: cover;
    border-radius: 8px;
    flex-shrink: 0;
}

.thongtin {
    flex: 1;
}

.gia {
    color: #8A5A2B;
    font-weight: bold;
}

.tong {
    text-align: right;
    font-size: 22px;
    font-weight: bold;
    margin-top: 25px;
}

.nut {
    
    background-color: #001F3F;
    color: #FFF8E7;
    padding: 10px;
    border: none;
    
    cursor: pointer;
    font-family: "Times New Roman", serif;
    font-size: 30px;
    margin: 3px;

}
button:hover {
    background-color: #8A5A2B;
    color: #FFF8E7;
}

.rong {
    text-align: center;
    padding: 35px 10px;
}

        
    </style>
</head>

<body>

    <div class thongbao1>
        <a href="header.html">
         <img src="https://cdn.phototourl.com/member/2026-10-15-9326430f-fdc1-453e-bd4f-98518ae7bc1c.png"
                     alt="The Muse" width ="150" height="120">
        </a>
    </div>
    <div class="nd-giohang"> 
        Giỏ hàng của bạn 
    </div>

   
<div class="anhnen"> 

    <div class="khung">
        <div id="danhsach"></div>
        <div id="tongtien"></div>
        <div id="nut"></div>
    </div>
</div>
    <script>
        function layGioHang() {
            return JSON.parse(localStorage.getItem("gioHang")) || [];
        }

        function hienThiGioHang() {
            let gioHang = layGioHang();
            let danhsach = document.getElementById("danhsach");
            let tongtien = document.getElementById("tongtien");
            let nut = document.getElementById("nut");

            danhsach.innerHTML = "";
            tongtien.innerHTML = "";
            nut.innerHTML = "";

            if (gioHang.length === 0) {
                danhsach.innerHTML = `
                    <div class="rong">
                        <h3>Giỏ hàng đang trống!</h3>
                        <p>Hãy chọn những chiếc bánh bạn yêu thích nhé.</p>
                        <button onclick="location.href='sanpham.html'">
                            Quay lại mua hàng
                        </button>
                    </div>
                `;
                return;
            }

            let tong = 0;

            gioHang.forEach(function(sp, index) {
    let thanhTien = sp.gia * sp.soLuong;
    tong += thanhTien;

    danhsach.innerHTML += `
        <div class="sanpham">

            <img
                src="${sp.anh || sp.hinhAnh || sp.image || 'https://placehold.co/120x120?text=The+Muse'}"
                alt="${sp.ten}"
                class="anh-sanpham"
            >

            <div class="thongtin">
                <h3>${sp.ten}</h3>

                <p>Kích thước: ${sp.kichThuoc || sp.size || 'Chưa có'}</p>

                <p>Đơn giá:
                    <span class="gia">
                        ${sp.gia.toLocaleString("vi-VN")}đ
                    </span>
                </p>

                <p>Thành tiền:
                    <span class="gia">
                        ${thanhTien.toLocaleString("vi-VN")}đ
                    </span>
                </p>
            </div>

            <div>
                <button onclick="thayDoiSoLuong(${index}, -1)">−</button>

                <strong>${sp.soLuong}</strong>

                <button onclick="thayDoiSoLuong(${index}, 1)">+</button>

                <br>

                <button class="xoa" onclick="xoaSanPham(${index})">
                    Xóa
                </button>
            </div>

        </div>
    `;
});

            tongtien.innerHTML = `
                <div class="tong">
                    Tổng tiền: ${tong.toLocaleString("vi-VN")}đ
                </div>
            `;

            nut.innerHTML = `
                <div class="nut">
                    <button onclick="location.href='sanpham.html'">
                        ← Tiếp tục mua hàng
                    </button>
                    <button class="xoa" onclick="xoaTatCa()">
                        Xóa tất cả
                    </button>
                </div>
            `;
        }

        function thayDoiSoLuong(index, thayDoi) {
            let gioHang = layGioHang();

            gioHang[index].soLuong += thayDoi;

            if (gioHang[index].soLuong <= 0) {
                gioHang.splice(index, 1);
            }

            localStorage.setItem("gioHang", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaSanPham(index) {
            let gioHang = layGioHang();

            gioHang.splice(index, 1);

            localStorage.setItem("gioHang", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaTatCa() {
            if (confirm("Bạn có chắc muốn xóa tất cả sản phẩm?")) {
                localStorage.removeItem("gioHang");
                hienThiGioHang();
            }
        }

        hienThiGioHang();
    </script>
</body>
</html>
