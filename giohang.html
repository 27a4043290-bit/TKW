<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
     <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: #FFF8E7;
            color: #001F3F;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
        }

        .khung {
            max-width: 850px;
            margin: 30px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
        }

        .trong {
            text-align: center;
            padding: 35px 10px;
        }

        .nut {
            display: inline-block;
            background-color: #001F3F;
            color: white;
            padding: 12px 18px;
            border: none;
            text-decoration: none;
            cursor: pointer;
            margin: 8px 3px;
        }
        .nut:hover {
            background-color: #fff8E7;
            color: #001F3F;
        }

        .san-pham {
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
        }

        .nut-nho {
            padding: 5px 10px;
            cursor: pointer;
            margin: 0 5px;
        }

        .tong-tien {
            text-align: right;
            font-size: 20px;
            font-weight: bold;
        }

        .nut-xoa {
            color: #9B2226;
            cursor: pointer;
            border: none;
            background: none;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>GIỎ HÀNG CỦA BẠN</h1>

    <div class="khung">
        <div id="noiDungGioHang"></div>
    </div>

    <script>
        function layGioHang() {
            return JSON.parse(localStorage.getItem("gioHangTheMuse")) || [];
        }

        function hienThiGioHang() {
            var gioHang = layGioHang();
            var noiDung = document.getElementById("noiDungGioHang");

            if (gioHang.length === 0) {
                noiDung.innerHTML = `
                    <div class="trong">
                        <h2>Giỏ hàng đang trống!</h2>
                        <p>Bạn chưa chọn sản phẩm nào.</p>

                        <a class="nut" href="sanpham.html">
                            Quay lại trang sản phẩm
                        </a>
                    </div>
                `;
                return;
            }

            var html = "";
            var tongTien = 0;

            for (var i = 0; i < gioHang.length; i++) {
                var sp = gioHang[i];
                var thanhTien = sp.gia * sp.soLuong;

                tongTien += thanhTien;

                html += `
                    <div class="san-pham">
                        <h3>${sp.ten}</h3>
                        <p>Kích thước: ${sp.kichThuoc}</p>
                        <p>Đơn giá: ${sp.gia.toLocaleString("vi-VN")}đ</p>

                        <p>
                            Số lượng:

                            <button class="nut-nho"
                                onclick="thayDoiSoLuong(${i}, -1)">
                                -
                            </button>

                            ${sp.soLuong}

                            <button class="nut-nho"
                                onclick="thayDoiSoLuong(${i}, 1)">
                                +
                            </button>
                        </p>

                        <p>
                            Thành tiền:
                            <b>${thanhTien.toLocaleString("vi-VN")}đ</b>
                        </p>

                        <button class="nut-xoa"
                            onclick="xoaSanPham(${i})">
                            Xóa sản phẩm
                        </button>
                    </div>
                `;
            }

            html += `
                <p class="tong-tien">
                    Tổng tiền: ${tongTien.toLocaleString("vi-VN")}đ
                </p>

                <div style="text-align:center;">
                    <a class="nut" href="sanpham.html">
                        Tiếp tục mua hàng
                    </a>

                    <button class="nut" onclick="xoaTatCa()">
                        Xóa toàn bộ giỏ hàng
                    </button>
                </div>
            `;

            noiDung.innerHTML = html;
        }

        function thayDoiSoLuong(index, thayDoi) {
            var gioHang = layGioHang();

            gioHang[index].soLuong += thayDoi;

            if (gioHang[index].soLuong <= 0) {
                gioHang.splice(index, 1);
            }

            localStorage.setItem("gioHangTheMuse", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaSanPham(index) {
            var gioHang = layGioHang();

            gioHang.splice(index, 1);

            localStorage.setItem("gioHangTheMuse", JSON.stringify(gioHang));
            hienThiGioHang();
        }

        function xoaTatCa() {
            localStorage.removeItem("gioHangTheMuse");
            hienThiGioHang();
        }

        hienThiGioHang();
    </script>


</body>
</html>
</body>
</html>
