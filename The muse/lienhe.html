<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Muse Xin Chào</title>
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
   <div class="container">

    <div class="left-col">
     <h1>The Muse Xin Chào</h1>
        <ul class="info-list">

    <li>
        <i class="fa-solid fa-location-dot"></i>
        <span>
            12 Chùa Bộc, P. Kim Liên, Đống Đa, Hà Nội
        </span>
    </li>

    <li>
        <i class="fa-solid fa-phone"></i>
        <span>
            0826590133
        </span>
    </li>

    <li>
        <i class="fa-regular fa-envelope"></i>
        <span>
            contact@themuse.com
        </span>
    </li>

</ul>
<div class="map-box">

    <iframe
     src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4464.31232370882!2d105.82836323034611!3d21.008894997252256!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac8006cc07f5%3A0x5295d70e63fa239d!2zTmcuIDEyIFAuIENow7lhIELhu5ljLCBLaW0gTGnDqm4sIEjDoCBO4buZaSwgVmnhu4d0IE5hbQ!5e0!3m2!1svi!2s!4v1790272661712!5m2!1svi!2s" width="450" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        
    </iframe>

</div>
    </div>

    <div class="right-col">

        <p class="form-desc">
    Quý khách vui lòng điền thông tin theo mẫu bên dưới.
    Mọi thắc mắc liên quan đến sản phẩm, dịch vụ,
    chúng mình
    <span class="highlight">
        sẽ cố gắng phản hồi trong thời gian sớm nhất.
    </span>
</p>
<form>
  
 <div class="form-group">

    <input
        type="text"
        placeholder="Họ và tên"
        required>

</div>
<div class="form-group">

    <input
        type="email"
        placeholder="Email"
        required>

</div>
<div class="form-group">

    <input
        type="tel"
        placeholder="Số điện thoại"
        required>

</div>
<div class="form-group">

    <input
        type="text"
        placeholder="Tiêu đề">

</div>
<div class="form-group">

    <textarea
        placeholder="Nội dung"
        required></textarea>

</div>
</form>
    </div>
<div class="recaptcha-box">
    <div class="recaptcha-left">
        <input type="checkbox" id="robot">
        <label for="robot">Tôi không phải là người máy</label>
    </div>
<div class="btn-container">

    <button type="submit" class="submit-btn">
        Gửi →
    </button>

</div>
    
</div>
</div>

</div> 
</body>
</html>
