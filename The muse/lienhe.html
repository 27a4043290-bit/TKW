<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Muse Xin Chào</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <style>
        .breadcrumb-bar {
  background: var(--bar);
  padding: 12px 0;
  font-size: 14px;
}
.breadcrumb-content {
  max-width: 1400px;
  margin: 0 auto;
  padding: 0 48px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.breadcrumb-content a { color: var(--ink); text-decoration: none; }
.breadcrumb-content a:hover { color: var(--price); }
.breadcrumb-content .separator { color: var(--muted); }
.breadcrumb-content .current { color: var(--muted); }

/* ===== KHUNG TRẮNG BO GÓC 2 CỘT ===== */
.container {
  max-width: 1400px;
  margin: 65px auto 60px;
  padding: 48px;
  background: var(--card);
  border-radius: 20px;
  display: grid;
  grid-template-columns: 520px 1fr;
  gap: 40px;
  align-items: start;
}

/* ===== CỘT TRÁI ===== */
.left-col h1 {
  font-family: 'Playfair Display', Georgia, serif;
  font-weight: 800;
  font-size: 40px;
  line-height: 1.2;
  text-transform: uppercase;
  color: var(--ink);
  margin: 40px 0 40px;
  letter-spacing: -0.5px;
}

.info-list {
  list-style: none;
  margin: 0 0 24px;
  padding: 0;
}
.info-list li {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  padding: 6px 0;
}
.info-list i {
  width: 16px;
  text-align: center;
  font-size: 15px;
  color: var(--ink);
}
.info-list a { color: var(--ink); text-decoration: none; }
.info-list a:hover { color: var(--price); }

.map-box {
  border-radius: 12px;
  overflow: hidden;
  height: 300px;
}
.map-box iframe {
  width: 100%;
  height: 100%;
  border: 0;
  display: block;
}

/* ===== CỘT PHẢI ===== */
.form-desc {
  text-align: center;
  font-size: 16px;
  line-height: 1.4;
  margin: 28px 0 38px;
}
.form-desc .highlight { color: #e02020; }

.form-group { margin-bottom: 12px; }

.form-group input,
.form-group textarea {
  width: 100%;
  height: 46px;
  padding: 0 20px;
  font-size: 16px;
  background: #fff;
  border: 1px solid var(--ink);
  border-radius: 8px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.form-group textarea {
  height: 173px;
  padding: 12px 20px;
  resize: vertical;
}
.form-group input::placeholder,
.form-group textarea::placeholder {
  color: #9aa0ab;
}
.form-group input:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(253, 200, 110, .35);
}

/* Báo lỗi */
.error-text {
  display: none;
  margin-top: 6px;
  font-size: 13px;
  color: var(--err);
}
.form-group.error input,
.form-group.error textarea { border-color: var(--err); }
.form-group.error .error-text { display: block; }

/* ===== reCAPTCHA + NÚT GỬI ===== */
.recaptcha-box {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 16px;
  margin-top: 16px;
}
.recaptcha-left {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 302px;
  height: 76px;
  padding: 0 14px;
  background: #fff;
  border: 1px solid #d3d3d3;
  border-radius: 3px;
  box-shadow: 0 0 4px rgba(0, 0, 0, .08);
}
.recaptcha-left input[type="checkbox"] {
  width: 28px;
  height: 28px;
  flex-shrink: 0;
  margin: 0;
  cursor: pointer;
  accent-color: var(--ink);
}
.recaptcha-left label {
  font-size: 14px;
  line-height: 1.3;
  cursor: pointer;
}
.recaptcha-left.error { border-color: var(--err); }

.btn-container {
  width: 100%;
  text-align: center;
}
.submit-btn {
  min-width: 92px;
  padding: 12px 24px;
  font-size: 16px;
  font-weight: 500;
  background: var(--accent);
  color: var(--ink);
  border: 0;
  border-radius: 10px;
  cursor: pointer;
  transition: transform .15s, filter .15s;
}
.submit-btn:hover { filter: brightness(.96); transform: translateY(-1px); }

/* Thông báo sau khi gửi */
.form-msg {
  display: none;
  margin-top: 14px;
  text-align: center;
  font-size: 15px;
}
.form-msg.ok  { display: block; color: var(--ok); }
.form-msg.bad { display: block; color: var(--err); }

/* ===== MÀN HÌNH NHỎ ===== */
@media (max-width: 960px) {
  .container {
    grid-template-columns: 1fr;
    margin: 24px 16px;
    padding: 24px;
  }
  .left-col h1 { font-size: 30px; margin: 8px 0 24px; }
  .form-desc { margin: 8px 0 24px; }
  .map-box { height: 260px; }
  .breadcrumb-content { padding: 0 16px; }
}
    </style>
</head>


<body class="contact-page">

<div class="breadcrumb-bar">
        <div class="breadcrumb">
        <div class="breadcrumb-inner">
            <a href="#">Trang chủ</a> <span>/</span> <a href="#">Liên</a>
        </div>
    </div>
    </div>
    
    <div class="container">

        
        <div class="left-col">
            <h1>The Muse Xin Chào</h1>
            
            <ul class="info-list">
                <li>
                    <i class="fa-solid fa-location-dot"></i>
                    <span>12 Chùa Bộc, P. Kim Liên, Đống Đa, Hà Nội</span>
                </li>
                <li>
                    <i class="fa-solid fa-phone"></i>
                    <span>0826590133</span>
                </li>
                <li>
                    <i class="fa-regular fa-envelope"></i>
                    <span>contact@themuse.com</span>
                </li>
            </ul>

            <div class="map-box">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d4464.31232370882!2d105.82836323034611!3d21.008894997252256!2m3!1f0!1f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ac8006cc07f5%3A0x5295d70e63fa239d!2zTmcuIDEyIFAuIENow7lhIELhu5ljLCBLaW0gTGnDqm4sIEjDoCBO4buZaSwgVmnhu4d0IE5hbQ!5e0!3m2!1svi!2s!4v1790272661712!5m2!1svi!2s" width="450" height="300" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>
        </div>

        
        <div class="right-col">
            <p class="form-desc">
                Quý khách vui lòng điền thông tin theo mẫu bên dưới.
                Mọi thắc mắc liên quan đến sản phẩm, dịch vụ, chúng mình
            <span class="highlight">sẽ cố gắng phản hồi trong thời gian sớm nhất.</span>
            </p>

            <form>
                <div class="form-group">
                    <input type="text" placeholder="Họ và tên" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="tel" placeholder="Số điện thoại" required>
                </div>
                <div class="form-group">
                    <input type="text" placeholder="Tiêu đề">
                </div>
                <div class="form-group">
                    <textarea placeholder="Nội dung" required></textarea>
                </div>

                <!-- Đưa recaptcha-box vào bên trong form -->
                <div class="recaptcha-box">
                    <div class="recaptcha-left">
                        <input type="checkbox" id="robot">
                        <label for="robot">Tôi không phải là người máy</label>
                    </div>
                    <div class="btn-container">
                        <button type="submit" class="submit-btn">Gửi →</button>
                    </div>
                </div>
            </form>
        </div>

    </div> 

</body>
</html>
