<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giỏ hàng - The Muse</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="header.css">
<style>
:root{--pad:clamp(16px,5vw,80px)}
body{background:var(--bg)}

/* Breadcrumb */
.crumb{background:var(--bar);padding:clamp(10px,1.6vw,14px) var(--pad);color:var(--muted);font-size:clamp(14px,1.5vw,16px)}
.crumb a:hover{color:var(--price)}
.crumb span{margin:0 8px}

/* Khung giỏ hàng */
.cart-page{padding:clamp(24px,5vw,64px) var(--pad) clamp(48px,7vw,96px)}
.cart-box{max-width:1096px;margin:0 auto;background:var(--card);border-radius:20px;padding:clamp(18px,3vw,32px);min-height:420px}
.cart-box h1{font-weight:800;font-size:clamp(26px,3.4vw,38px);line-height:1.25}
.cart-line{border:0;border-top:1px solid var(--line);margin:clamp(16px,2.4vw,24px) 0}
[hidden]{display:none!important}

/* Nút */
.btn{display:inline-block;background:var(--accent);color:var(--ink);border:0;border-radius:8px;
  padding:12px 20px;font:600 15px var(--font-main);cursor:pointer;transition:background .2s,color .2s}
.btn:hover{background:var(--price);color:#fff}
.btn:focus-visible,.qty button:focus-visible,.remove:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* Giỏ trống */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:20px;padding:clamp(40px,8vw,90px) 0}
.empty h2{font-weight:800;font-size:clamp(20px,2.6vw,28px)}

/* Danh sách sản phẩm */
.item{display:grid;grid-template-columns:96px 1fr auto auto;align-items:center;gap:clamp(12px,2vw,24px);padding:18px 0;border-bottom:1px solid var(--line)}
.item:first-child{padding-top:0}
.item .pic{width:96px;aspect-ratio:1;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#e8d9c4,#b9926a)}
.item .pic img{width:100%;height:100%;object-fit:cover}
.item h3{font-size:clamp(16px,1.6vw,18px);font-weight:600;line-height:1.4}
.item .unit{color:var(--muted);font-size:15px;margin-top:4px}
.item .line-total{font-weight:600;color:var(--price);min-width:110px;text-align:right}

.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.qty button{width:36px;height:36px;border:0;background:none;font-size:18px;cursor:pointer;color:var(--ink)}
.qty button:hover{background:var(--bar)}
.qty span{min-width:32px;text-align:center;font-weight:500}
.remove{grid-column:2;justify-self:start;background:none;border:0;padding:0;color:var(--muted);font-size:14px;cursor:pointer;text-decoration:underline}
.remove:hover{color:var(--err)}

/* Tổng tiền */
.summary{display:flex;flex-direction:column;align-items:flex-end;gap:14px;padding-top:24px}
.total{font-size:18px}
.total b{color:var(--price);font-size:24px;margin-left:8px}
.summary-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end}
.btn.ghost{background:var(--bar)}
.btn.ghost:hover{background:var(--accent);color:var(--ink)}

@media(max-width:640px){
  .item{grid-template-columns:72px 1fr;grid-template-areas:"pic info" "qty total" "rm rm"}
  .item .pic{width:72px;grid-area:pic}
  .item .info{grid-area:info}
  .item .qty{grid-area:qty;justify-self:start}
  .item .line-total{grid-area:total;min-width:0}
  .remove{grid-area:rm;grid-column:auto}
  .summary,.summary-actions{align-items:stretch;justify-content:stretch}
  .summary-actions .btn{flex:1;text-align:center}
}
</style>
<script src="float.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<script src="header.js"></script>

<main class="cart-page">
  <div class="cart-box">
    <h1>Giỏ hàng</h1>
    <hr class="cart-line">

    <!-- Giỏ trống -->
    <section class="empty" id="empty" hidden>
      <h2>Giỏ hàng đang trống, quay lại mua hàng?</h2>
      <a class="btn" href="sanppham.html">Quay trở lại cửa hàng</a>
    </section>

    <!-- Giỏ có hàng -->
    <section id="filled" hidden>
      <div id="items"></div>
      <div class="summary">
        <p class="total">Tạm tính:<b id="total">0VND</b></p>
        <div class="summary-actions">
          <a class="btn ghost" href="sanppham.html">Tiếp tục mua hàng</a>
          <a class="btn" href="thanhtoan.html">Thanh toán</a>
        </div>
      </div>
    </section>
  </div>
</main>

<script>
/* Giỏ hàng lưu trong localStorage với khóa "cart":
   [{id, name, price, img, qty}] — header.js đọc cùng khóa này để hiện số trên biểu tượng giỏ */
const fmt = n => n.toLocaleString("en-US") + "VND";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const load = () => { try { return JSON.parse(localStorage.getItem("cart") || "[]"); } catch { return []; } };
const save = cart => {
  localStorage.setItem("cart", JSON.stringify(cart));
  dispatchEvent(new Event("cart-updated"));   // để header cập nhật số lượng
};

function render(){
  const cart = load();
  document.getElementById("empty").hidden = cart.length > 0;
  document.getElementById("filled").hidden = cart.length === 0;
  if (!cart.length) return;

  document.getElementById("items").innerHTML = cart.map(p => `
    <article class="item" data-id="${esc(p.id)}">
      <div class="pic">${p.img ? `<img src="${esc(p.img)}" alt="${esc(p.name)}" onerror="this.remove()">` : ""}</div>
      <div class="info">
        <h3>${esc(p.name)}</h3>
        <p class="unit">${fmt(p.price || 0)}</p>
      </div>
      <div class="qty" role="group" aria-label="Số lượng ${esc(p.name)}">
        <button type="button" data-act="dec" aria-label="Giảm">−</button>
        <span>${p.qty}</span>
        <button type="button" data-act="inc" aria-label="Tăng">+</button>
      </div>
      <p class="line-total">${fmt((p.price || 0) * p.qty)}</p>
      <button class="remove" type="button" data-act="rm">Xóa</button>
    </article>`).join("");

  document.getElementById("total").textContent = fmt(cart.reduce((s, p) => s + (p.price || 0) * p.qty, 0));
}

document.getElementById("items").addEventListener("click", e => {
  const btn = e.target.closest("[data-act]");
  if (!btn) return;
  const id = btn.closest(".item").dataset.id;
  let cart = load();
  const it = cart.find(x => x.id === id);
  if (!it) return;
  if (btn.dataset.act === "inc") it.qty++;
  if (btn.dataset.act === "dec") it.qty = Math.max(1, it.qty - 1);
  if (btn.dataset.act === "rm") cart = cart.filter(x => x.id !== id);
  save(cart);
  render();
});

addEventListener("storage", render);   // giỏ đổi ở tab khác
render();
</script>

</body>
</html>
