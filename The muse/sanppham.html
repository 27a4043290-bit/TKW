<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sản phẩm - The Muse</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="sanpham.css">
<script src="float.js" defer></script>
</head>
<body>
<div id="site-header"></div>
<script src="header.js"></script>

<nav class="breadcrumb" aria-label="Breadcrumb"><a href="trangchu.html">Trang chủ</a><span>/</span>Sản phẩm</nav>

<main class="container">
  <h1 class="page-title">Sản phẩm</h1>
  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div id="products"></div>
  </div>
</main>

<!-- Giỏ hàng trượt bên phải -->
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="drawer" aria-label="Giỏ hàng">
  <header>
    <button class="back" id="closeCart" type="button" aria-label="Đóng giỏ hàng">←</button>
    <h2>GIỎ HÀNG</h2>
  </header>
  <div class="d-items" id="dItems"></div>
  <footer>
    <div class="r"><span>Số lượng</span><span id="dCount">0 sản phẩm</span></div>
    <div class="r big"><span>Tổng thanh toán</span><span id="dTotal">0VND</span></div>
    <a class="go" href="giohang.html">Xem giỏ hàng →</a>
  </footer>
</aside>

<script src="sanpham.js"></script>

</html>
