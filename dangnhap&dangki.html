<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Muse - Đăng ký & Đăng nhập </title>

    <style>
        body {
            font-family: Arial;
            background: #fff8E7;
        }

        .container {
            width: 350px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            box-shadow: 0 0 10px #ccc;
            border-radius: 15px;
        }

        h1 {
            color: #001F3F;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #001F3F;
            color: white;
            border: none;
            cursor: pointer;
        }

    

        .link {
            text-align: center;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- ĐĂNG KÝ -->
    <div id="register">
        <h1>Đăng ký</h1>

        <label>Họ tên:</label>
        <input type="text" id="ten" placeholder="Nhập họ tên">

        <label>Email:</label>
        <input type="email" id="email" placeholder="Nhập email">

        <label>Số điện thoại:</label>
        <input type="text" id="phone" placeholder="Nhập số điện thoại">

        <label>Mật khẩu:</label>
        <input type="password" id="pass" placeholder="Nhập mật khẩu">

        <label>Nhập lại mật khẩu:</label>
        <input type="password" id="repass" placeholder="Nhập lại mật khẩu">

        <button onclick="dangKy()">Đăng ký</button>

        <p class="link" onclick="hienDangNhap()">
            Đã có tài khoản? <b>Đăng nhập</b>
        </p>
    </div>

    <!-- ĐĂNG NHẬP -->
    <div id="login" class="hidden">
        <h1>Đăng nhập</h1>

        <label>Email:</label>
        <input type="email" id="loginEmail" placeholder="Nhập email">

        <label>Mật khẩu:</label>
        <input type="password" id="loginPass" placeholder="Nhập mật khẩu">

        <button onclick="dangNhap()">Đăng nhập</button>

        <p class="link" onclick="hienDangKy()">
            Bạn chưa có tài khoản? <b>Đăng ký ngay</b>
        </p>
    </div>

</div>

<script>
    function hienDangNhap() {
        document.getElementById("register").classList.add("hidden");
        document.getElementById("login").classList.remove("hidden");
    }

    function hienDangKy() {
        document.getElementById("login").classList.add("hidden");
        document.getElementById("register").classList.remove("hidden");
    }

    function dangKy() {
        var ten = document.getElementById("ten").value;
        var email = document.getElementById("email").value;
        var phone = document.getElementById("phone").value;
        var pass = document.getElementById("pass").value;
        var repass = document.getElementById("repass").value;

        if (!ten || !email || !phone || !pass || !repass) {
            alert("Vui lòng nhập đầy đủ thông tin!");
            return;
        }

        if (pass != repass) {
            alert("Mật khẩu không giống nhau!");
            return;
        }

        localStorage.setItem("ten", ten);
        localStorage.setItem("email", email);
        localStorage.setItem("phone", phone);
        localStorage.setItem("pass", pass);

        alert("Đăng ký thành công!");

        hienDangNhap();
        document.getElementById("loginEmail").value = email;
    }

    function dangNhap() {
        var email = document.getElementById("loginEmail").value;
        var pass = document.getElementById("loginPass").value;

        if (
            email == localStorage.getItem("email") &&
            pass == localStorage.getItem("pass")
        ) {
            alert("Đăng nhập thành công! Xin chào "
                + localStorage.getItem("ten"));
        } else {
            alert("Email hoặc mật khẩu không đúng!");
        }
    }
</script>

</body>
</html>
