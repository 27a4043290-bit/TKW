<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The MuSe Header</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
</head>
<body>
<header>
    <div class="logo">
       <img src="images/logo.jpg" alt="Logo">
    </div>
    <div class="menu">
        <li>Giới Thiệu</li>
        <li>Sản Phẩm</li>
        <li>Chính Sách</li>
        <li>Tin Tức</li>
        <li>Liên Hệ</li>
        

    </div>
    <div class="others">
    <!-- Cụm bên phải của Header -->
<div class="others">
    <ul>
        <!-- ĐÂY CHÍNH LÀ ĐOẠN CODE KÍNH LÚP TÌM KIẾM -->
        <li>
            <input placeholder="Tìm kiếm" type="text">
            <i class="fa fa-search"></i>
        </li>

        <!-- Các nút khác kế bên (như giỏ hàng, tài khoản) -->
        <li><a class="fa fa-shopping-bag" href=""></a></li>
        <li><a class="fa fa-user" href=""></a></li>
    </ul>
</div>
</div>  
    
</div>
    </div>
</header> 
    
</body>
</html>
